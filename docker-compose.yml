services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shorefront
      POSTGRES_USER: shorefront
      POSTGRES_PASSWORD: shorefront-dev-only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorefront -d shorefront"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - shorefront_pg:/var/lib/postgresql/data

volumes:
  shorefront_pg:
