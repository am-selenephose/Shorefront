services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SHOREFRONT_DB_NAME:-shorefront}
      POSTGRES_USER: ${SHOREFRONT_DB_USER:-shorefront}
      POSTGRES_PASSWORD: ${SHOREFRONT_DB_PASSWORD-${PORTFLOW_DB_PASSWORD-}}
    volumes:
      - shorefront_prod_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: shorefront-api:${SHOREFRONT_IMAGE_TAG-${PORTFLOW_IMAGE_TAG:-local}}
    environment:
      SHOREFRONT_RUNTIME_MODE: training
      DATABASE_URL: postgresql+psycopg://${SHOREFRONT_DB_USER:-shorefront}:${SHOREFRONT_DB_PASSWORD-${PORTFLOW_DB_PASSWORD-}}@postgres:5432/${SHOREFRONT_DB_NAME:-shorefront}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "python",
        "-m",
        "shorefront_api.migrate"
      ]
    restart: "no"

  api:
    image: shorefront-api:${SHOREFRONT_IMAGE_TAG-${PORTFLOW_IMAGE_TAG:-local}}
    build:
      context: ./apps/api
    environment:
      SHOREFRONT_RUNTIME_MODE: training
      DATABASE_URL: postgresql+psycopg://${SHOREFRONT_DB_USER:-shorefront}:${SHOREFRONT_DB_PASSWORD-${PORTFLOW_DB_PASSWORD-}}@postgres:5432/${SHOREFRONT_DB_NAME:-shorefront}
      SHOREFRONT_SCHEMA_MODE: verify
      SHOREFRONT_APPROVERS_JSON: ${SHOREFRONT_APPROVERS_JSON-${PORTFLOW_APPROVERS_JSON-}}
      SHOREFRONT_INTEGRATIONS_JSON: ${SHOREFRONT_INTEGRATIONS_JSON-${PORTFLOW_INTEGRATIONS_JSON:-[]}}
      SHOREFRONT_AIS_URL: ${SHOREFRONT_AIS_URL-${PORTFLOW_AIS_URL:-}}
      SHOREFRONT_AIS_PROVIDER: ${SHOREFRONT_AIS_PROVIDER-${PORTFLOW_AIS_PROVIDER:-}}
      SHOREFRONT_WEATHER_URL: ${SHOREFRONT_WEATHER_URL-${PORTFLOW_WEATHER_URL:-}}
      SHOREFRONT_WEATHER_PROVIDER: ${SHOREFRONT_WEATHER_PROVIDER-${PORTFLOW_WEATHER_PROVIDER:-}}
      SHOREFRONT_BERTH_PLAN_URL: ${SHOREFRONT_BERTH_PLAN_URL-${PORTFLOW_BERTH_PLAN_URL:-}}
      SHOREFRONT_BERTH_PLAN_PROVIDER: ${SHOREFRONT_BERTH_PLAN_PROVIDER-${PORTFLOW_BERTH_PLAN_PROVIDER:-}}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8100"
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-sync",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/readyz').read()"
        ]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  web:
    image: shorefront-web:${SHOREFRONT_IMAGE_TAG-${PORTFLOW_IMAGE_TAG:-local}}
    build:
      context: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${SHOREFRONT_HTTP_PORT-${PORTFLOW_HTTP_PORT:-8088}}:80"
    restart: unless-stopped

volumes:
  shorefront_prod_pg:
