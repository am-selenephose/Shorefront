services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portflow
      POSTGRES_USER: portflow
      POSTGRES_PASSWORD: ${PORTFLOW_DB_PASSWORD:?PORTFLOW_DB_PASSWORD is required}
    volumes:
      - portflow_prod_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portflow -d portflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://portflow:${PORTFLOW_DB_PASSWORD:?PORTFLOW_DB_PASSWORD is required}@postgres:5432/portflow
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8100"
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-sync",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz').read()"
        ]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PORTFLOW_HTTP_PORT:-8088}:80"
    restart: unless-stopped

volumes:
  portflow_prod_pg:
