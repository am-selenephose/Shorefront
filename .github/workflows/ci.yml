name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: ../../deploy/basicdeploy_bundle.sh /tmp/portflow-public-deploy.tgz

  deployment:
    runs-on: ubuntu-latest
    env:
      PORTFLOW_DB_PASSWORD: ci-placeholder
      PORTFLOW_APPROVERS_JSON: '[]'
      PORTFLOW_IMAGE_TAG: ci
      PORTFLOW_HTTPS_PORT: 8443
      PORTFLOW_PUBLIC_HTTPS_ORIGIN: https://localhost:8443
      PORTFLOW_TLS_CERT_FILE: /tmp/portflow-ci.crt
      PORTFLOW_TLS_KEY_FILE: /tmp/portflow-ci.key
    steps:
      - uses: actions/checkout@v4
      - run: sh -n deploy/basicdeploy_boot.sh deploy/basicdeploy_prepare.sh deploy/basicdeploy_bundle.sh
      - run: bash -n ops/backup-postgres.sh
      - run: bash -n ops/restore-postgres.sh
      - run: docker compose -f docker-compose.prod.yml config >/dev/null
      - run: docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml config >/dev/null
      - run: docker build -t portflow-api:ci apps/api
      - run: docker build -t portflow-web:ci apps/web
