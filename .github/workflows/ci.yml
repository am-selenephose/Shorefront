name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: shorefront-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest -q

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --extra dev
      - name: Start disposable PostgreSQL with private Unix socket
        run: |
          set -euo pipefail
          sock=/tmp/shorefront-product-pg.ci
          mkdir -p "$sock"
          chmod 0777 "$sock"
          docker run -d --rm \
            --name shorefront-ci-postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$sock:/var/run/postgresql" \
            postgres:17-alpine \
            -c unix_socket_directories=/var/run/postgresql \
            -c listen_addresses=
          for attempt in $(seq 1 60); do
            if test -S "$sock/.s.PGSQL.5432"; then exit 0; fi
            sleep 0.25
          done
          docker logs shorefront-ci-postgres
          exit 1
      - name: Verify PostgreSQL concurrency and backup restore
        working-directory: apps/api
        env:
          SF_TEST_POSTGRES_URL: postgresql+psycopg://postgres@/postgres?host=/tmp/shorefront-product-pg.ci
        run: uv run pytest -q tests/test_product_postgres.py
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker stop shorefront-ci-postgres || true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test:config
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: ../../deploy/basicdeploy_bundle.sh /tmp/shorefront-public-deploy.tgz

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install browser and API dependencies
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}
          cd ../api
          uv sync --extra dev
          cd ../web
          npm run build
      - name: Operational browser workflows (${{ matrix.browser }})
        env:
          SHOREFRONT_E2E_BROWSER: ${{ matrix.browser }}
        run: npm run test:product
      - name: Training and simulator regressions
        if: matrix.browser == 'chromium'
        run: npm run test:e2e

  delivery:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: docker build -t shorefront-web:local .
      - run: npm run test:delivery

  deployment:
    runs-on: ubuntu-latest
    env:
      SHOREFRONT_DB_PASSWORD: ci-placeholder
      SHOREFRONT_APPROVERS_JSON: '[]'
      SHOREFRONT_IMAGE_TAG: ci
      SHOREFRONT_HTTPS_PORT: 8443
      SHOREFRONT_PUBLIC_HTTPS_ORIGIN: https://localhost:8443
      SHOREFRONT_TLS_CERT_FILE: /tmp/shorefront-ci.crt
      SHOREFRONT_TLS_KEY_FILE: /tmp/shorefront-ci.key
    steps:
      - uses: actions/checkout@v4
      - run: sh -n deploy/basicdeploy_boot.sh deploy/basicdeploy_prepare.sh deploy/basicdeploy_bundle.sh
      - run: bash -n ops/backup-postgres.sh
      - run: bash -n ops/restore-postgres.sh
      - run: bash -n ops/scheduled-backup.sh ops/operational-healthcheck.sh ops/install-user-ops.sh
      - run: docker compose -f docker-compose.prod.yml config >/dev/null
      - run: docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml config >/dev/null
      - run: docker build -t shorefront-api:ci apps/api
      - run: docker build -t shorefront-web:ci apps/web
